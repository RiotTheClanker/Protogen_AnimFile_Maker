name: Release

# Builds the tool for Windows, macOS and Linux and publishes a GitHub release;
# each file is added as soon as its build finishes.
# Start it by pushing a version tag (e.g. V3), or from the Actions tab with
# "Run workflow" on main, entering the version — the tag is then created on
# the current main commit. Run on dev, it makes a test build; the version must
# contain "-dev", e.g. V5-dev.1. A version with a "-" in it becomes a DRAFT
# prerelease: only repo members can see it, so the website never picks it up.
#
# Asset names must keep their Windows_ / Mac_ / Linux_ prefixes: the website's
# download buttons find the files by those prefixes.
on:
  push:
    tags: [ 'V*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (main: e.g. V5; dev: e.g. V5-dev.1)'
        required: true

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  # Creates the release first (or finds one made by hand), so each build can
  # add its file the moment it finishes: a slow macOS queue no longer holds
  # back the Windows and Linux downloads.
  release:
    name: Create release
    # Manual releases only from main (release) or dev (prerelease)
    if: >-
      github.event_name == 'push' || github.ref == 'refs/heads/main' ||
      (github.ref == 'refs/heads/dev' && contains(inputs.version, '-dev'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release made by hand on the Releases page (which also pushes the
          # tag and starts this workflow) already exists: keep its title and
          # notes, the builds just add their files to it.
          if gh release view "$VERSION" >/dev/null 2>&1; then exit 0; fi
          case "$VERSION" in
            *-*) pre=true; set -- --draft --prerelease --latest=false ;;
            *)   pre=false; set -- ;;
          esac
          notes="docs/releases/${VERSION}.md"
          if [ -f "$notes" ]; then set -- "$@" --notes-file "$notes"
          elif $pre && [ -f docs/releases/dev.md ]; then set -- "$@" --notes-file docs/releases/dev.md
          else set -- "$@" --generate-notes; fi
          # --target creates the tag on this commit when it doesn't exist yet
          # (manual runs); for a pushed tag it already points here.
          gh release create "$VERSION" \
            --title "Protogen Animation Tool ${VERSION}" \
            --target "$GITHUB_SHA" "$@"

  build:
    name: Build ${{ matrix.asset }}
    needs: release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          # Oldest supported Ubuntu: the Linux build bundles the system's Tcl/Tk,
          # which only runs on a glibc at least as old as the build machine's.
          - os: ubuntu-22.04
            built: dist/protogen_tool
            asset: Linux_protogen_tool
          - os: macos-latest
            built: dist/protogen_tool
            asset: Mac_protogen_tool
          - os: windows-latest
            built: dist/protogen_tool.exe
            asset: Windows_protogen_tool.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk portaudio19-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install portaudio

      - name: Install Python dependencies
        run: pip install pyinstaller numpy pyaudio

      - name: Build
        run: pyinstaller --onefile --windowed --add-data "displays:displays" protogen_tool.py

      - name: Rename
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.built }}" "out/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

      - name: Add to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$VERSION" "out/${{ matrix.asset }}" --clobber

